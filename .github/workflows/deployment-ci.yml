name: Deployment CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libopenblas-dev

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build native backend and C tests
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build --parallel
          ctest --test-dir build --output-on-failure

      - name: Install deployment dependencies
        run: pip install -r requirements-dev.txt

      - name: Test deployment
        run: pytest -q tests/test_deployment_inference.py tests/test_deployment_api.py

      - name: Build Space image
        run: docker build -t c-cuda-pinn-space .
